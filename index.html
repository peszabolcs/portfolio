<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Perjési Szabolcs" />
    <meta name="theme-color" content="#0c0b14" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Pre-paint: enable scroll-reveal only when JS runs, so no-JS users see
         all content immediately (SEO-safe) and there is no flash of hidden. -->
    <script>
      (function () {
        try {
          var m = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
          if (!m || !m.matches) document.documentElement.classList.add("js-anim");
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Playfair Display (editorial display) + Geist (body) + Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />


    <!-- Title & description are injected per-page/per-language via <Seo> (SSG). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
